    steps:
      - run:
          name: wrap the SKUs at zone c
          command: |
            mkdir -p /tmp/chi
            set +o pipefail 2>/dev/null; s="abcdefghij"; for i in $(seq 1 1000); do echo "${s:0:${#s}} rev=${s}"; done > /tmp/chi/fnv_59ae89830; true
            du -k /tmp/chi/fnv_59ae89830 | awk '{print $1,"KB"}'
      - persist_to_workspace:
          root: /tmp/chi
          paths:
            - 'fnv_59ae89830'
